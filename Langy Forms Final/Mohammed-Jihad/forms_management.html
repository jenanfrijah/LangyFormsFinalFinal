<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="icon"  href="images/icon.png" >
    <style>
      :root {
        --clr-primary: #5d956b;
        --clr-background: #f8f9fa;
      }
      body {
        background-color: var(--clr-background);
        font-family: "Arial", sans-serif;
        overflow-x: hidden;
      }
      .sidebar {
        width: 15rem !important;
        min-height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        background-color: var(--clr-primary);
        padding-top: 1rem;
        color: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      .sidebar-brand {
        padding: 1rem;
        font-size: 1.5rem;
        font-weight: bold;
        color: #fff;
        text-decoration: none;
        display: block;
        margin-bottom: 1rem;
        text-align: center;
      }
      .sidebar .nav-item .nav-link {
        padding: 1rem 1rem;
        color: rgba(255, 255, 255, 0.8);
        display: flex;
        align-items: center;
      }
      .sidebar .nav-item .nav-link i {
        margin-right: 10px;
      }
      .sidebar .nav-item.active .nav-link {
        color: var(--clr-primary);
        background-color: rgba(255, 255, 255, 0.9);
        border-radius: 0 50px 50px 0;
        margin: 0.25rem 0;
        margin-left: 1rem;
        padding-left: 2rem;
      }
      #content-wrapper {
        margin-left: 15rem;
        padding: 1.5rem;
        min-height: 100vh;
        width: calc(100% - 15rem);
      }
      .table th,
      .table td {
        vertical-align: middle;
      }
      .btn-edit {
        background-color: #0dcaf0;
        color: white;
        border: none;
      }
      .btn-edit:hover {
        background-color: #0dcaf0;
        opacity: 0.9;
      }
      .btn-deactivate {
        background-color: #ffc107;
        color: white;
        border: none;
      }
      .btn-deactivate:hover {
        background-color: #ffc107;
        opacity: 0.9;
      }
      .btn-activate {
        background-color: #28a745;
        color: white;
        border: none;
      }
      .btn-activate:hover {
        background-color: #28a745;
        opacity: 0.9;
      }
      .btn-delete {
        background-color: #dc3545;
        color: white;
        border: none;
      }
      .btn-delete:hover {
        background-color: #dc3545;
        opacity: 0.9;
      }
      .badge-active {
        background-color: #28a745;
      }
      .badge-inactive {
        background-color: #6c757d;
      }
    </style>
  </head>
  <body>
    <div id="wrapper" class="d-flex">
      <ul class="navbar-nav sidebar">
        <a class="sidebar-brand" href="admin.html">
           <img src="Images/logo1.png"  height="50px" />
        </a>
        <li class="nav-item">
          <a class="nav-link" href="admin.html">
            <i class="fas fa-fw fa-home"></i>
            <span>Home Page</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="create_forms.html">
            <i class="fas fa-fw fa-file-alt"></i>
            <span>Create Forms</span>
          </a>
        </li>
        <li class="nav-item active">
          <a class="nav-link" href="forms_management.html">
            <i class="fas fa-fw fa-list-alt"></i>
            <span>Manage All Forms</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="users_management.html">
            <i class="fas fa-fw fa-users"></i>
            <span>Show Users</span>
          </a>
        </li>
        <li class="nav-item mt-5">
          <a
            class="nav-link text-white-50"
            href="Login.html"
            style="font-weight: bold"
          >
            <i class="fas fa-fw fa-sign-out-alt"></i>
            <span>Logout</span>
          </a>
        </li>
      </ul>

      <div id="content-wrapper">
        <h1 class="h3 mb-4">Forms Management</h1>

        <!-- ⭐ رسالة الخطأ/النجاح هنا ⭐ -->
        <div id="messageBox" class="alert d-none mx-3"></div>

        <div class="card">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-striped" id="formsTable">
                <thead>
                  <tr>
                    <th>#ID</th>
                    <th>Form Title</th>
                    <th>Q. Count</th>
                    <th>Creation Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="formsTableBody">
                  <!-- سيتم ملؤه بالـ JavaScript -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="confirmDeleteModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Confirm Delete</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            Are you sure you want to delete this form?
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="forms_management.js"></script>
  </body>
</html>
