<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - LandyForm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon"  href="images/icon.png" >
    <style>
        :root {
            --clr-primary: #5D956B; /* Primary Green */
            --clr-secondary: #6c757d;
            --clr-background: #f8f9fa; 
            --clr-sidebar: #5D956B; 
            --clr-success: #28a745;
            --clr-danger: #dc3545;
            --clr-info: #17a2b8;
        }

        body {
            background-color: var(--clr-background); 
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
            direction: ltr; 
            text-align: left;
        }
        
        /* Sidebar */
        .sidebar {
            width: 15rem !important;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0; 
            z-index: 1000;
            background-color: var(--clr-sidebar);
            padding-top: 1rem;
            color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-brand {
            padding: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            display: block;
            margin-bottom: 1rem;
        }

        .sidebar .nav-item .nav-link {
            padding: 1rem 1rem;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
        }
        
        .sidebar .nav-item .nav-link i {
            margin-right: 10px; 
        }
        
        .sidebar .nav-item.active .nav-link {
            color: var(--clr-primary);
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 0 50px 50px 0; 
            margin: 0.25rem 0;
            margin-left: 1rem;
        }

        /* Content Wrapper */
        #content-wrapper {
            margin-left: 15rem; 
            padding: 1.5rem;
            min-height: 100vh;
            width: calc(100% - 15rem);
        }

        /* Profile Card */
        .profile-card {
            margin-bottom: 1.5rem;
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.05);
        }

        .profile-header {
            background-color: #e9ecef;
            color: var(--clr-primary);
            font-weight: bold;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #dee2e6;
        }

        .profile-img-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 1.5rem;
        }
        
        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--clr-primary);
        }
        
        .upload-icon {
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: var(--clr-info);
            color: white;
            border-radius: 50%;
            padding: 0.5rem;
            cursor: pointer;
            line-height: 1;
        }
    </style>
</head>
<body>

<div id="wrapper" class="d-flex">
    <ul class="navbar-nav sidebar">
        <a class="sidebar-brand" href="Home.html">
            <img src="Images/logo1.png"  height="50px"style="margin-left: 15%;" />
        </a>
        
        <li class="nav-item">
            <a class="nav-link" href="user.html">
                <i class="fas fa-fw fa-home"></i>
                <span>Language Portal</span>
            </a>
        </li>

        <li class="nav-item"> 
            <a class="nav-link" href="my_results.html">
                <i class="fas fa-fw fa-poll"></i> 
                <span>My Results</span>
            </a>
        </li>

        <li class="nav-item active">
            <a class="nav-link" href="profile.html">
                <i class="fas fa-fw fa-user"></i>
                <span>My Profile</span>
            </a>
        </li>
        
        <li class="nav-item">
            <a class="nav-link" href="settings.html">
                <i class="fas fa-fw fa-cog"></i>
                <span>Settings</span>
            </a>
        </li>

        <!-- Logout -->
        <li class="nav-item mt-5"> 
            <a class="nav-link" href="Login.html" style="color: white; background: none; border: none;">
                <i class="fas fa-fw fa-sign-out-alt"></i>
                <span style="font-weight: bold;">Logout</span>
            </a>
        </li>
    </ul>

    <div id="content-wrapper">
        <nav class="navbar navbar-expand topbar mb-4 bg-white rounded shadow-sm">
            <div class="container-fluid">
                <h2 class="h5 mb-0 fw-bold"><i class="fas fa-user-circle me-2"></i> My Personal Profile</h2>
            </div>
        </nav>

        <div id="content">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-lg-5">
                        <div class="card profile-card">
                            <div class="profile-header"><i class="fas fa-address-card me-2"></i> Personal Details</div>
                            <div class="card-body text-center" id="profile-view-section">
                                <div class="profile-img-container">
                                    <img class="profile-img" src="Images/Sample_User_Icon.png" alt="User Avatar">
                                    <span class="upload-icon"><i class="fas fa-camera"></i></span>
                                </div>
                                
                                <ul class="list-group list-group-flush text-start">
                                    <li class="list-group-item">
                                        <i class="fas fa-user text-primary me-2"></i> Username: <span id="profile-username">—</span>
                                    </li>
                                    <li class="list-group-item">
                                        <i class="fas fa-envelope text-info me-2"></i> Email: <span id="profile-email">—</span>
                                    </li>
                                    <li class="list-group-item">
                                        <i class="fas fa-phone text-success me-2"></i> Phone: <span id="profile-phone">—</span>
                                    </li>
                                    <li class="list-group-item">
                                        <i class="fas fa-calendar-alt text-warning me-2"></i> Date of Birth: <span id="profile-dob">—</span>
                                    </li>
                                </ul>

                                <!-- ✅ Main Edit Button (with correct ID) -->
                                <button id="edit-profile-btn" class="btn btn-outline-primary mt-4">
                                    <i class="fas fa-edit me-1"></i> Edit Profile
                                </button>
                            </div>

                            <!-- ✅ Edit Form (initially hidden) -->
                            <div class="card-body" id="edit-form-section" style="display: none;">
                                <form id="profile-edit-form">
                                    <div class="mb-2">
                                        <label class="form-label">Username</label>
                                        <input type="text" class="form-control" id="edit-username" required>
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" id="edit-email" required>
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label">Phone</label>
                                        <input type="tel" class="form-control" id="edit-phone" required>
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label">Date of Birth</label>
                                        <input type="date" class="form-control" id="edit-dob" required>
                                    </div>
                                    <div class="d-flex gap-2 mt-3">
                                        <button type="submit" class="btn btn-success btn-sm">
                                            <i class="fas fa-save me-1"></i> Save Changes
                                        </button>
                                        <button type="button" id="cancel-edit" class="btn btn-secondary btn-sm">
                                            <i class="fas fa-times me-1"></i> Cancel
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- 🔗 Link to profile.js -->
<script src="profile.js"></script>

</body>
</html>
