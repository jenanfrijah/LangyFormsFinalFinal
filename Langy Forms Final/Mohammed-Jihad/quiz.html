<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css   " rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css   ">
  <link rel="icon"  href="images/icon.png" >
  <style>
    body { background-color: #f8f9fa; }
    .quiz-header { background-color: #5D956B; color: white; }
    .language-badge {
      font-weight: bold;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header quiz-header text-center">
            <h2 id="quiz-title">Loading Quiz...</h2>
          </div>
          <div class="card-body">
            <form id="quizForm">
              <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted">Preparing your quiz...</p>
              </div>
            </form>
          </div>
        </div>

        <div class="text-center mt-3">
          <a href="user.html" class="btn btn-outline-secondary">&larr; Back to Dashboard</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Load quiz data & logic -->
  <script src="Quizes-Questions.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
