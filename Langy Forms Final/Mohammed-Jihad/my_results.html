<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Results - Quiz History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon"  href="images/icon.png" >
    <style>
        :root {
            --clr-primary: #5D956B; /* Primary Green */
            --clr-secondary: #6c757d;
            --clr-background: #f8f9fa; 
            --clr-sidebar: #5D956B; 
            --clr-success: #28a745;
            --clr-danger: #dc3545;
            --clr-info: #17a2b8;
        }

        body {
            background-color: var(--clr-background); 
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
            direction: ltr;
            text-align: left;
        }
        
        /* Sidebar */
        .sidebar {
            width: 15rem !important;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0; 
            z-index: 1000;
            background-color: var(--clr-sidebar);
            padding-top: 1rem;
            color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-brand {
            padding: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            display: block;
            margin-bottom: 1rem;
        }

        .sidebar .nav-item .nav-link {
            padding: 0.75rem 1rem;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
        }
        
        .sidebar .nav-item .nav-link i {
            margin-right: 10px;
        }
        
        .sidebar .nav-item.active .nav-link {
            color: var(--clr-primary);
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 0 50px 50px 0; 
            margin: 0.25rem 0;
            margin-left: 1rem;
        }

        /* Content Wrapper */
        #content-wrapper {
            margin-left: 15rem; 
            padding: 1.5rem;
            min-height: 100vh;
            width: calc(100% - 15rem);
        }

        /* Results Table */
        .results-card {
            background-color: #fff;
            border-radius: 0.75rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.05);
            padding: 2rem;
        }

        .results-card .card-header {
            background: none;
            border-bottom: none;
            padding: 0;
            margin-bottom: 1rem;
        }
        
        .results-table thead th {
            background-color: var(--clr-sidebar);
            color: white;
            font-weight: 600;
        }
        
        .results-table tbody tr:hover {
            background-color: #f1f1f1;
            cursor: pointer;
        }

        .score-pass {
            font-weight: bold;
            color: var(--clr-success);
        }
        
        .score-fail {
            font-weight: bold;
            color: var(--clr-danger);
        }
        
        .info-box {
            background-color: #e8f0fe;
            color: #007bff;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

<div id="wrapper" class="d-flex">
    <ul class="navbar-nav sidebar">
        <a class="sidebar-brand" href="Home.html">
           <img src="Images/logo1.png"  height="50px"style="margin-left: 15%;" />
        </a>
        
        <li class="nav-item"> 
            <a class="nav-link" href="user.html">
                <i class="fas fa-fw fa-home"></i>
                <span>Language Portal</span>
            </a>
        </li>

        <li class="nav-item active">  
            <a class="nav-link" href="my_results.html">
                <i class="fas fa-fw fa-poll"></i> 
                <span>My Results</span>
            </a>
        </li>

        <li class="nav-item"> 
            <a class="nav-link" href="profile.html">
                <i class="fas fa-fw fa-user"></i>
                <span>My Profile</span>
            </a>
        </li>

        <li class="nav-item"> 
            <a class="nav-link" href="settings.html">
                <i class="fas fa-fw fa-cog"></i>
                <span>Settings</span>
            </a>
        </li>

        <!-- ✅ ADDED: Logout section under Settings (as requested) -->
        <li class="nav-item mt-4">
            <a class="nav-link text-danger" href="Login.html">
                <i class="fas fa-fw fa-sign-out-alt" style="margin-top: 55px;  color: white; font-weight: bold;"></i>
                <span style="margin-top: 55px; color: white; font-weight: bold;">Logout</span>
            </a>
        </li>
    </ul>

    <div id="content-wrapper">
       

        <div id="content">
            <div class="container-fluid">
                <div class="info-box">
                    <i class="fas fa-chart-line me-2"></i> Your Performance Overview
                </div>

                <div class="results-card">
                    <h3 class="fw-bold mb-4">My Quiz History</h3>
                    
                    <div class="table-responsive">
                        <table class="table table-striped results-table mb-0">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Quiz Name</th>
                                    <th>Date Taken</th>
                                    <th>Score (%)</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="resultsBody">
                                <!-- 🔄 Dynamic data inserted by JS -->
                                <tr>
                                    <td colspan="6" class="text-center py-4">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                        <p class="mt-2 text-muted">Fetching your results...</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="text-center mt-4 pt-3 border-top">
                        <a href="user.html" class="btn btn-secondary btn-sm">
                            <i class="fas fa-home me-2"></i> Back to Portal
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ✅ my_results.js embedded (beginner-friendly)
document.addEventListener("DOMContentLoaded", function () {
    // 🔑 Get logged-in user
    const username = localStorage.getItem("loggedInUser") || sessionStorage.getItem("loggedInUser");
    
    const tbody = document.getElementById("resultsBody");
    
    if (!username) {
        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="text-center py-4 text-danger">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    You are not logged in. Please log in to view results.
                </td>
            </tr>
        `;
        return;
    }

    // 🔍 Get user's quiz history: quizHistory_<username>
    const userKey = `quizHistory_${username}`;
    const history = JSON.parse(localStorage.getItem(userKey) || "[]");

    // 🧾 Build table rows
    if (history.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="text-center py-4 text-muted">
                    <i class="fas fa-clipboard-list me-2"></i>
                    No quizzes taken yet.<br>
                    <a href="user.html" class="text-primary mt-2 d-inline-block">← Go take a quiz!</a>
                </td>
            </tr>
        `;
        return;
    }

    // 📋 Generate rows
    let rows = "";
    history.forEach((quiz, index) => {
        // Capitalize language: "arabic" → "Arabic"
        const quizName = quiz.language.charAt(0).toUpperCase() + quiz.language.slice(1) + " Quiz";
        
        const scorePercent = Math.round((quiz.score / quiz.total) * 100);
        const status = scorePercent >= 50 ? "Passed" : "Failed";
        const statusClass = scorePercent >= 50 ? "score-pass" : "score-fail";
        const statusIcon = scorePercent >= 50 ? "✅" : "❌";

        rows += `
            <tr>
                <td>${index + 1}</td>
                <td>${quizName}</td>
                <td>${quiz.date}</td>
                <td>
                    <strong>${quiz.score}/${quiz.total}</strong> 
                    <small>(${scorePercent}%)</small>
                </td>
                <td class="${statusClass}">${statusIcon} ${status}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" onclick="alert('Review feature coming soon!')">
                        <i class="fas fa-eye"></i>
                    </button>
                </td>
            </tr>
        `;
    });

    tbody.innerHTML = rows;
});
</script>

</body>
</html>
